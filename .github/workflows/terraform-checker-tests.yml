name: Terraform Checker Tests

on:
  pull_request:
    paths:
      - "workspace-setup/terraform-checker/**"
      - ".github/workflows/terraform-checker-tests.yml"
      - ".github/workflows/requirements-terraform-checker-tests.*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-setup/terraform-checker

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      # Hash-locked install; see requirements-terraform-checker-tests.in to regenerate.
      # The project itself isn't installed: tests import its modules from the working directory.
      - name: Install dependencies
        run: python -m pip install --require-hashes --no-deps -r "$GITHUB_WORKSPACE/.github/workflows/requirements-terraform-checker-tests.txt"
      - name: Run tests
        run: python -m pytest
