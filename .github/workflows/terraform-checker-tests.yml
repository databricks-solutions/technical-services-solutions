name: Terraform Checker Tests

on:
  pull_request:
    paths:
      - "workspace-setup/terraform-checker/**"
      - ".github/workflows/terraform-checker-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-setup/terraform-checker

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: workspace-setup/terraform-checker/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
