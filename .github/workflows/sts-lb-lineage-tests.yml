name: STS Lakebridge Lineage Tests

on:
  pull_request:
    paths:
      - "dw-migration/sts-lb-lineage/**"
      - ".github/workflows/sts-lb-lineage-tests.yml"
      - ".github/workflows/requirements-sts-lb-lineage-tests.*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dw-migration/sts-lb-lineage

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Hash-locked install; see requirements-sts-lb-lineage-tests.in to regenerate.
      # The package itself isn't installed: pytest puts the project folder on sys.path.
      - name: Install dependencies
        run: python -m pip install --require-hashes --no-deps -r "$GITHUB_WORKSPACE/.github/workflows/requirements-sts-lb-lineage-tests.txt"
      - name: Run tests
        run: python -m pytest -q
