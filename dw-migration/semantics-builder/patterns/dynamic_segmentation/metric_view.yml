version: 1.1
comment: Customers graded by yearly spend.
source: samples.tpch.orders
fields:
  - name: Order Year
    expr: YEAR(source.o_orderdate)
  - name: Customer Year Spend
    expr: SUM(source.o_totalprice) OVER (PARTITION BY source.o_custkey, YEAR(source.o_orderdate))
  - name: Spend Tier
    expr: >-
      CASE WHEN `Customer Year Spend` < 300000 THEN '1 Low'
      WHEN `Customer Year Spend` < 600000 THEN '2 Medium' ELSE '3 High' END
measures:
  - name: Customers
    expr: COUNT(DISTINCT source.o_custkey)
  - name: Revenue
    expr: SUM(source.o_totalprice)
