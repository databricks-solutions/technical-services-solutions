name: Release changed assets

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs so back-to-back merges can't compute the same next tag.
concurrency:
  group: release-assets
  cancel-in-progress: false

jobs:
  release:
    # workflow_dispatch can target any ref; only main is review-gated.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # need full history + tags to diff against the last release

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - run: pip install --require-hashes -r .github/workflows/requirements-release-assets.txt

      - name: Release assets whose folder changed
        run: python .github/scripts/release_assets.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attest release zips
        if: hashFiles('dist/*.zip') != ''
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*.zip
