version: 1.1
comment: Revenue with quarter-to-date and year-to-date totals.
source: samples.tpch.orders
fields:
  - name: Order Year
    expr: YEAR(source.o_orderdate)
  - name: Order Quarter
    expr: DATE_TRUNC('QUARTER', source.o_orderdate)
  - name: Order Month
    expr: DATE_TRUNC('MONTH', source.o_orderdate)
measures:
  - name: Revenue
    expr: SUM(source.o_totalprice)
  - name: Revenue YTD
    display_name: Revenue year to date
    expr: MEASURE(Revenue)
    window:
      - order: Order Month
        range: cumulative
      - order: Order Year
        range: current
  - name: Revenue QTD
    display_name: Revenue quarter to date
    expr: MEASURE(Revenue)
    window:
      - order: Order Month
        range: cumulative
      - order: Order Quarter
        range: current
