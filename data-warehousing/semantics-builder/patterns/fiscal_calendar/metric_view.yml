version: 1.1
comment: Revenue by a fiscal year that starts on July 1.
source: samples.tpch.orders
fields:
  - name: Order Month
    expr: DATE_TRUNC('MONTH', source.o_orderdate)
  - name: Fiscal Year
    expr: YEAR(ADD_MONTHS(source.o_orderdate, 6))
  - name: Fiscal Quarter
    expr: CONCAT('FQ', QUARTER(ADD_MONTHS(source.o_orderdate, 6)))
measures:
  - name: Revenue
    expr: SUM(source.o_totalprice)
  - name: Revenue FYTD
    display_name: Revenue fiscal year to date
    expr: MEASURE(Revenue)
    window:
      - order: Order Month
        range: cumulative
      - order: Fiscal Year
        range: current
