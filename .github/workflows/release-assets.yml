name: Release changed assets

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs so back-to-back merges cannot update the same releases concurrently.
concurrency:
  group: release-assets
  cancel-in-progress: false

jobs:
  release:
    # workflow_dispatch can target any ref; only main is review-gated.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # need full history + tags to diff against the last release

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - run: pip install --require-hashes -r .github/workflows/requirements-release-assets.txt

      # Build, attest, then publish, so no zip goes public without an attestation.
      - name: Build zips for changed assets
        run: python .github/scripts/release_assets.py build
        env:
          GH_TOKEN: ${{ github.token }}

      # Attest and publish are disabled per go/hardened-gha until #unblock-releases-public
      # approves re-enabling releases. To re-enable, restore: if: hashFiles('dist/*.zip') != ''
      # Build still runs as a read-only dry run.
      - name: Attest release zips
        if: false
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*.zip

      - name: Publish releases
        if: false
        run: python .github/scripts/release_assets.py publish
        env:
          GH_TOKEN: ${{ github.token }}
